<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="Кармашек — учёт денег, долгов и кармашков" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Кармашек</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 id="header-title">Кармашек</h1>
      <div class="header-actions">
        <button id="btn-theme" class="icon-btn" title="Тема" aria-label="Тема">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </div>
    </header>

    <!-- Dashboard -->
    <section id="dashboard" class="section active">
      <div class="balance-box">
        <div class="balance-label">Всего в кармашках</div>
        <div id="dash-totals" class="balance-totals"></div>
      </div>

      <div class="cards two">
        <div class="card card-owed">
          <div class="card-label">Мне должны</div>
          <div class="card-value" id="dash-owed">—</div>
        </div>
        <div class="card card-owe">
          <div class="card-label">Я должен</div>
          <div class="card-value" id="dash-owe">—</div>
        </div>
      </div>

      <div id="goals-home" class="goals-home hidden"></div>

      <h2 class="section-title">Кармашки</h2>
      <div id="pockets-preview" class="pockets-grid"></div>
      <button class="btn btn-add" id="btn-add-pocket-dash">+ Новый кармашек</button>

      <h2 class="section-title">Ближайшее</h2>
      <div id="upcoming-list" class="list"></div>
    </section>

    <!-- Debts -->
    <section id="debts" class="section">
      <div class="debts-summary">
        <div class="debt-side owed">
          <div class="debt-side-label">Мне должны</div>
          <div class="debt-side-value" id="debt-sum-owed">0</div>
        </div>
        <div class="debt-divider"></div>
        <div class="debt-side owe">
          <div class="debt-side-label">Я должен</div>
          <div class="debt-side-value" id="debt-sum-owe">0</div>
        </div>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="owed">Мне должны</button>
        <button class="tab" data-tab="owe">Я должен</button>
      </div>
      <div id="debts-owed" class="tab-content active">
        <button class="btn btn-add" id="btn-add-owed">+ Кто мне должен</button>
        <div id="list-owed" class="list"></div>
      </div>
      <div id="debts-owe" class="tab-content">
        <button class="btn btn-add" id="btn-add-owe">+ Кому я должен</button>
        <div id="list-owe" class="list"></div>
      </div>
    </section>

    <!-- Stats = History + Statistics -->
    <section id="stats" class="section">
      <div class="tabs">
        <button class="tab active" data-stat-tab="history">История</button>
        <button class="tab" data-stat-tab="charts">Статистика</button>
      </div>
      <div id="stat-history" class="tab-content active">
        <div class="filter-row">
          <select id="tx-filter-type">
            <option value="all">Все</option>
            <option value="expense">Расходы</option>
            <option value="income">Доходы</option>
          </select>
          <select id="tx-filter-pocket">
            <option value="all">Все кармашки</option>
          </select>
        </div>
        <div id="list-tx" class="list"></div>
      </div>
      <div id="stat-charts" class="tab-content">
        <div class="period-tabs">
          <button class="period-btn active" data-period="week">Неделя</button>
          <button class="period-btn" data-period="month">Месяц</button>
          <button class="period-btn" data-period="year">Год</button>
        </div>
        <div class="chart-summary" id="chart-summary"></div>
        <h2 class="section-title">По категориям</h2>
        <div id="pie-categories" class="pie-wrap"></div>
        <div id="stats-categories" class="stats-list"></div>
        <h2 class="section-title">По кармашкам</h2>
        <div id="stats-pockets" class="stats-list"></div>
      </div>
    </section>

    <!-- More -->
    <section id="more" class="section">
      <div class="profile-card">
        <div class="profile-avatar" id="profile-avatar">К</div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name">Без имени</div>
          <button class="link-btn" id="btn-edit-profile">Изменить имя</button>
        </div>
      </div>

      <h2 class="section-title">Кармашки</h2>
      <div id="list-pockets" class="list"></div>
      <button class="btn btn-add" id="btn-add-pocket">+ Новый кармашек</button>

      <h2 class="section-title">Категории</h2>
      <div id="list-categories" class="list compact"></div>
      <button class="btn btn-add" id="btn-add-category">+ Категория</button>

      <h2 class="section-title">Цели</h2>
      <div id="list-goals" class="list compact"></div>
      <button class="btn btn-add" id="btn-add-goal">+ Цель</button>

      <h2 class="section-title">Настройки</h2>
      <div class="settings-row">
        <span>Тема</span>
        <select id="setting-theme">
          <option value="dark">Тёмная</option>
          <option value="light">Светлая</option>
          <option value="system">Как в системе</option>
        </select>
      </div>

      <h2 class="section-title">Данные</h2>
      <div class="form-group">
        <label>Импорт CSV / выписки</label>
        <input type="file" id="csv-file" accept=".csv,text/csv" />
      </div>
      <button class="btn btn-secondary full" id="btn-export">Экспорт JSON</button>
      <button class="btn btn-danger" id="btn-clear">Очистить всё</button>
      <p class="hint" style="margin-top:16px">Данные хранятся только на устройстве.</p>
    </section>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-section="dashboard">
        <svg class="nav-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
        <span>Главная</span>
      </button>
      <button class="nav-btn" data-section="debts">
        <svg class="nav-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span>Долги</span>
      </button>
      <button class="nav-btn nav-fab" id="nav-fab" title="Добавить">
        <span class="fab-circle">+</span>
      </button>
      <button class="nav-btn" data-section="stats">
        <svg class="nav-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span>Стат</span>
      </button>
      <button class="nav-btn" data-section="more">
        <svg class="nav-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span>Ещё</span>
      </button>
    </nav>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Добавить</h3>
        <button id="modal-close" class="icon-btn" aria-label="Закрыть">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel">Отмена</button>
        <button class="btn btn-primary" id="modal-save">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Action sheet -->
  <div id="fab-sheet" class="sheet hidden">
    <div class="sheet-backdrop" id="fab-backdrop"></div>
    <div class="sheet-content">
      <div class="sheet-handle"></div>
      <button class="sheet-item" data-action="tx">Доход / Расход</button>
      <button class="sheet-item" data-action="debt-owed">Мне должны</button>
      <button class="sheet-item" data-action="debt-owe">Я должен</button>
      <button class="sheet-item" data-action="pocket">Новый кармашек</button>
      <button class="sheet-item cancel" id="fab-cancel">Отмена</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  </script>
</body>
</html>
